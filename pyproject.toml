[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vtk-validate"
version = "1.0.0"
description = "Library-first AST validation for VTK Python code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Patrick O'Leary" }
]
keywords = ["vtk", "validation", "ast", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "vtk-knowledge>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
]
translate = [
    "litellm>=1.0.0",
]

[project.scripts]
vtk-validate = "vtk_validate.cli:app"

[project.urls]
Homepage = "https://github.com/vicentebolea/vtk-validate"
Repository = "https://github.com/vicentebolea/vtk-validate"
"Bug Tracker" = "https://github.com/vicentebolea/vtk-validate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vtk_validate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["vtk_validate"]
